<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" role="presentation">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262630"/>
      <stop offset="1" stop-color="#14141a"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e2e3a"/>
      <stop offset="1" stop-color="#1b1b22"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38e1ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#3d8bff" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- ground glow -->
  <ellipse cx="280" cy="470" rx="170" ry="26" fill="#3d8bff" opacity="0.18" filter="url(#soft)"/>

  <!-- keycap body: tapered trapezoid silhouette -->
  <g>
    <!-- side faces -->
    <path d="M120 200 L440 200 L408 420 L152 420 Z" fill="url(#body)"/>
    <!-- left/right edge shading -->
    <path d="M120 200 L152 420 L168 420 L140 200 Z" fill="#0d0d12" opacity="0.8"/>
    <path d="M440 200 L408 420 L392 420 L420 200 Z" fill="url(#rim)" opacity="0.35"/>
    <!-- top face -->
    <path d="M120 200 L440 200 L408 152 L152 152 Z" fill="url(#top)"/>
    <path d="M152 152 L408 152" stroke="url(#rim)" stroke-width="3" opacity="0.8"/>
    <!-- front bottom edge highlight -->
    <path d="M152 420 L408 420" stroke="#3d8bff" stroke-width="3" opacity="0.55"/>

    <!-- raised >_ glyph -->
    <g transform="translate(280 320)" fill="#3d8bff">
      <g transform="translate(-58 0)">
        <rect x="-34" y="-7" width="52" height="13" rx="4" transform="rotate(-34)"/>
        <rect x="-34" y="-7" width="52" height="13" rx="4" transform="rotate(34)"/>
      </g>
      <rect x="22" y="26" width="64" height="13" rx="4"/>
    </g>
  </g>
</svg>
