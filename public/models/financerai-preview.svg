<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="680" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d101c" />
      <stop offset="100%" stop-color="#080a12" />
    </linearGradient>
    <linearGradient id="msgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5aa2ff" />
      <stop offset="100%" stop-color="#38e1ff" />
    </linearGradient>
  </defs>

  <!-- Outer Frame -->
  <rect width="680" height="420" rx="20" fill="url(#bgGrad)" stroke="#1e263d" stroke-width="1.5" />

  <!-- Top Message Bubble: "Gastei R$ 50 no Uber" -->
  <g transform="translate(36, 26)">
    <rect width="608" height="74" rx="16" fill="url(#msgGrad)" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.2" />
    <circle cx="38" cy="37" r="18" fill="#38bdf8" fill-opacity="0.16" />
    <text x="38" y="43" text-anchor="middle" fill="#38e1ff" font-family="Inter, -apple-system, sans-serif" font-size="15" font-weight="600">💬</text>
    <text x="70" y="31" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="0.08em">MENSAGEM RECEBIDA · WHATSAPP</text>
    <text x="70" y="54" fill="#f8fafc" font-family="Inter, -apple-system, sans-serif" font-size="19" font-weight="600">“Gastei R$ 50 no Uber”</text>
    <rect x="472" y="22" width="116" height="28" rx="14" fill="#0ea5e9" fill-opacity="0.15" stroke="#38e1ff" stroke-opacity="0.4" />
    <text x="530" y="40" text-anchor="middle" fill="#7dd3fc" font-family="JetBrains Mono, monospace" font-size="11" font-weight="500">Gemini AI ✓</text>
  </g>

  <!-- Connector Arrow -->
  <line x1="340" y1="100" x2="340" y2="126" stroke="url(#accentGrad)" stroke-width="1.5" stroke-dasharray="3 3" />
  <circle cx="340" cy="113" r="3.5" fill="#38e1ff" />

  <!-- Code Window Below -->
  <g transform="translate(36, 126)">
    <rect width="608" height="262" rx="16" fill="#070910" stroke="#1e293b" stroke-width="1.2" />
    <!-- Window Titlebar -->
    <rect width="608" height="38" rx="16" fill="#0d111d" />
    <line x1="0" y1="38" x2="608" y2="38" stroke="#1e293b" stroke-width="1" />
    <circle cx="22" cy="19" r="5.5" fill="#ef4444" fill-opacity="0.8" />
    <circle cx="40" cy="19" r="5.5" fill="#f59e0b" fill-opacity="0.8" />
    <circle cx="58" cy="19" r="5.5" fill="#10b981" fill-opacity="0.8" />
    <text x="304" y="23" text-anchor="middle" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="11">TransactionService.java — Spring Boot</text>

    <!-- Code Content -->
    <g font-family="JetBrains Mono, monospace" font-size="12.5">
      <text x="24" y="68" fill="#64748b">// 1. Interpretação da mensagem via Gemini + persistência Spring Boot</text>
      <text x="24" y="92" fill="#c084fc">@PostMapping<tspan fill="#94a3b8">(</tspan><tspan fill="#86efac">"/api/transactions/message"</tspan><tspan fill="#94a3b8">)</tspan></text>
      <text x="24" y="114" fill="#60a5fa">public <tspan fill="#38e1ff">TransactionDTO</tspan> <tspan fill="#f8fafc">processMessage</tspan><tspan fill="#94a3b8">(String text) {</tspan></text>
      <text x="44" y="136" fill="#f8fafc">var parsed = geminiClient.<tspan fill="#7dd3fc">extractTransaction</tspan>(<tspan fill="#86efac">"Gastei R$ 50 no Uber"</tspan>);</text>
      <text x="44" y="158" fill="#60a5fa">return <tspan fill="#f8fafc">transactionRepository.save(parsed);</tspan></text>
      <text x="24" y="180" fill="#94a3b8">}</text>

      <!-- Parsed JSON Output Pill -->
      <rect x="24" y="196" width="560" height="48" rx="10" fill="#0f172a" stroke="#1e3a8a" stroke-opacity="0.6" />
      <text x="40" y="216" fill="#38e1ff" font-size="11">OUTPUT JSON →</text>
      <text x="145" y="216" fill="#e2e8f0" font-size="11.5">{ "type": <tspan fill="#f87171">"EXPENSE"</tspan>, "amount": <tspan fill="#fbbf24">50.00</tspan>, "category": <tspan fill="#86efac">"Transporte"</tspan>, "desc": <tspan fill="#86efac">"Uber"</tspan> }</text>
      <text x="40" y="234" fill="#64748b" font-size="10.5">✓ Salvo no PostgreSQL · Atualizado no Dashboard React em tempo real</text>
    </g>
  </g>
</svg>
